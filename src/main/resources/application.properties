spring.application.name=autoloc-api
server.port=8082

# Connexion à la base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform : auto-detected by Hibernate 7, no need to specify
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

#api
server.servlet.context-path=/api

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Prevent serialization errors with uninitialized LAZY proxies (remove when DTOs are introduced)
spring.jackson.serialization.fail-on-empty-beans=false
